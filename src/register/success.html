<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Your CHORUS 2026 registration has been confirmed."
  >

  <title>Registration Confirmed — CHORUS 2026</title>

  <link
    rel="stylesheet"
    href="./success.css"
  >

</head>


<body>

  <main class="success-page">

    <nav class="success-nav">

      <a href="/" class="logo">
        CHORUS<span>2026</span>
      </a>

    </nav>


    <section class="success-container">

      <div class="success-icon">
        ✓
      </div>


      <p class="eyebrow">
        CHORUS 2026
      </p>


      <h1>
        You're
        <span>registered.</span>
      </h1>


      <p class="success-message">

        Your registration for CHORUS 2026
        has been successfully received.

        We can't wait to worship with you.

      </p>


      <div class="registration-card">

        <span>
          REGISTRATION ID
        </span>

        <strong id="registration-id">
          CH-2026---------
        </strong>

      </div>


      <div class="event-details">

        <div>

          <small>
            DATE
          </small>

          <strong>
            13 SEPTEMBER 2026
          </strong>

        </div>


        <div>

          <small>
            LOCATION
          </small>

          <strong>
            PORT HARCOURT, NIGERIA
          </strong>

        </div>

      </div>


      <div class="success-actions">

        <a
          href="/"
          class="primary-button"
        >
          Back to CHORUS
          <span>→</span>
        </a>


        <button
          type="button"
          class="secondary-button"
          id="copy-id"
        >
          Copy Registration ID
        </button>

      </div>


      <p
        class="copy-message"
        id="copy-message"
      ></p>


    </section>

  </main>


  <script
    type="module"
    src="./success.js"
  ></script>

</body>

</html>
